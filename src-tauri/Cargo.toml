[package]
name = "gocode-ide"
version = "0.1.0"
description = "Gocode IDE — free, local-first development environment"
authors = ["Gocode IDE contributors"]
edition = "2021"

[lib]
name = "gocode_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

