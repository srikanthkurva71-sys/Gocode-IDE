name: Frontend build

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Apply compatible dependency security updates
        run: npm audit fix
      - name: Commit generated npm lockfile on development branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/starter-scaffold'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "npm lockfile is already up to date."
            exit 0
          fi
          git commit -m "chore: add reproducible npm lockfile"
          git push
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              via: item.via.map(v => typeof v === 'string' ? v : v.name),
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: |
            npm-audit-report.json
            package-lock.json
          if-no-files-found: warn
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
