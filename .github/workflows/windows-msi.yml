name: Windows MSI build

on:
  workflow_dispatch:
  push:
    branches: ["work/**"]
    paths:
      - "src-tauri/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/windows-msi.yml"

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate Windows application icon
        run: python scripts/generate_icon.py
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows MSI
        run: npm run tauri -- build
      - name: Generate MSI SHA-256 checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi"
          if (-not $files) { throw "No MSI was produced." }
          foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)" | Out-File -FilePath "$($file.FullName).sha256" -Encoding ascii
          }
      - name: Upload MSI and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gocode-ide-windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sha256
          if-no-files-found: error
