name: Rust native tests

on:
  workflow_dispatch:
  push:
    branches: ["work/**"]
    paths:
      - "src-tauri/**"
      - "scripts/test_rust_analyzer_lsp.py"
      - "scripts/test_debugpy_dap.py"
      - ".github/workflows/rust-tests.yml"

permissions:
  contents: read

concurrency:
  group: rust-native-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python test runtime
        run: python --version
      - name: Generate application icons
        run: python scripts/generate_icon.py
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install real debug adapter test dependency
        run: python -m pip install --disable-pip-version-check debugpy==1.8.14
      - name: Run real debugpy DAP interoperability smoke test
        run: python scripts/test_debugpy_dap.py
      - name: Install Rust Analyzer
        run: rustup component add rust-analyzer
      - name: Run real Rust Analyzer LSP interoperability smoke test
        run: python scripts/test_rust_analyzer_lsp.py
      - name: Run native Rust unit and process-lifecycle tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
